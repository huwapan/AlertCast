<!--
- 想起させる機能
    - 朝に一日の予定一覧をアラーム表示
    - 期限を超過した予定を表示
    - 長期間放置されている予定を表示
        - 優先度の高い予定の期日前警告
        - 今週の完了済み予定一覧
- スケジュール管理機能
    - スケジュールの入力・変更・破棄機能
    - スケジュール完了の登録機能
        - 完了済み予定一覧（日時・優先度で絞れる）
        - 予定に優先度をつける機能
- 提案する機能
    - 設定されたカテゴリに関連するイベント一覧
    - 入力された予定から一日のスケジュール案を生成
        - 以前のデータからスケジュール案を生成
        - 生成したスケジュール案のフィードバックを受けて改善する
-->

<html>
    <head>
        <title>お知らせ放送</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h1>お知らせ放送</h1>        
        <!--今週のスケジュール一覧-->
        <p>今週のスケジュール一覧</p>
        <!--予定の入力・変更・破棄・復元が出来るページに飛ぶボタン-->
        <button>スケジュール編集ページ</button>
        <!--期限が近い予定一覧-->
        <p>期限が近い予定一覧</p>
        <!--期限を超過した予定一覧-->
        <p>期限を超過した予定一覧</p>
        <!--データ閲覧ページに飛ぶボタン
        完了済み予定一覧
        長期間放置されている予定一覧
        -->
        <button>データ閲覧ページ</button>
    </body>
</html>
